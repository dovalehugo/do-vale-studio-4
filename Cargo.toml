[workspace]
resolver = "2"

members = [
    "crates/dvs-app",
    "crates/dvs-core",
    "crates/dvs-ui",
    "crates/dvs-media",
    "crates/dvs-decoder",
    "crates/dvs-playback",
    "crates/dvs-gpu",
    "crates/dvs-render",
    "crates/dvs-audio",
    "crates/dvs-cache",
    "crates/dvs-project",
    "crates/dvs-export",
    "crates/dvs-ai",
    "tests/gpu_probe",
    "tests/gpu_nv12",
    "tests/gpu_d3d11_interop",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Proprietary"
authors = ["Hugo Do Vale"]

[workspace.dependencies]
dvs-core = { path = "crates/dvs-core" }
dvs-ui = { path = "crates/dvs-ui" }
dvs-media = { path = "crates/dvs-media" }
dvs-gpu = { path = "crates/dvs-gpu" }
dvs-decoder = { path = "crates/dvs-decoder" }
dvs-render = { path = "crates/dvs-render" }
dvs-playback = { path = "crates/dvs-playback" }
thiserror = "2.0.20"
wgpu = "27.0.1"
raw-window-handle = "0.6.2"
windows = "0.58"
egui = "0.33.3"
egui-wgpu = "0.33.3"
egui-winit = "0.33.3"
winit = "0.30"
